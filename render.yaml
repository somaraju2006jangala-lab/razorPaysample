services:
  - type: web
    name: freshcart-razorpay-backend
    env: node
    plan: free
    rootDir: freshcart-razorpay-template/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: live
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_PATH
        value: ./data/freshcart_payments.db
      - key: ADMIN_USERNAME
        value: admin

